
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب کاربری</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #10131b;
            color: #f1f5f9;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #1b202c;
            border: 1px solid #30394a;
            border-radius: 18px;
            padding: 28px;
        }

        h1 {
            font-size: 25px;
            margin-top: 0;
        }

        .subtitle {
            color: #9ca8ba;
            font-size: 14px;
            line-height: 1.9;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #394457;
            background: #111620;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: 0;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .secondary {
            background: #30394a;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .profile-row {
            padding: 14px 0;
            border-bottom: 1px solid #30394a;
        }

        .profile-row span {
            display: block;
            color: #9ca8ba;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .profile-row strong {
            overflow-wrap: anywhere;
        }

        .avatar {
            width: 76px;
            height: 76px;
            display: grid;
            place-items: center;
            background: #3730a3;
            border-radius: 50%;
            font-size: 32px;
            margin-bottom: 20px;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <main class="card">

        <section id="signup">
            <h1>ساخت حساب کاربری</h1>
            <p class="subtitle">
                حساب خودت رو بساز و وارد صفحهٔ کاربری شو.
            </p>

            <form id="signupForm">
                <label for="name">نام شما</label>
                <input id="name" type="text"
                       maxlength="60" required
                       placeholder="نام خود را وارد کنید">

                <label for="username">نام کاربری</label>
                <input id="username" type="text"
                       maxlength="30" required
                       placeholder="یک نام کاربری انتخاب کنید">

                <button id="submitBtn" type="submit">
                    ساخت حساب
                </button>
            </form>

            <p id="message" class="message" role="status"></p>
        </section>

        <section id="profile" hidden>
            <div class="avatar">👤</div>

            <h1>حساب کاربری شما</h1>
            <p class="subtitle">
                حساب شما با موفقیت ساخته شد.
            </p>

            <div class="profile-row">
                <span>نام</span>
                <strong id="profileName"></strong>
            </div>

            <div class="profile-row">
                <span>نام کاربری</span>
                <strong id="profileUsername"></strong>
            </div>

            <button class="secondary" id="logoutBtn">
                خروج از این صفحه
            </button>
        </section>

    </main>

    <script>
        const signup = document.getElementById("signup");
        const profile = document.getElementById("profile");
        const form = document.getElementById("signupForm");
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");

        function showProfile(account) {
            document.getElementById("profileName").textContent =
                account.name;

            document.getElementById("profileUsername").textContent =
                "@" + account.user_name;

            signup.hidden = true;
            profile.hidden = false;
        }

        // نمایش دوبارهٔ صفحهٔ حساب در همین مرورگر
        const savedAccount = localStorage.getItem("myAccount");

        if (savedAccount) {
            try {
                showProfile(JSON.parse(savedAccount));
            } catch {
                localStorage.removeItem("myAccount");
            }
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const username = document.getElementById("username")
                .value.trim();

            if (!name || !username) {
                message.textContent = "هر دو فیلد را پر کن.";
                return;
            }

            submitBtn.disabled = true;
            message.textContent = "در حال ساخت حساب...";

            try {
                const response = await fetch("/create-A", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        Name: name,
                        User_name: username
                    })
                });

                const result = await response.json().catch(() => null);

                if (!response.ok) {
                    throw new Error("سرور درخواست را نپذیرفت.");
                }

                // بک‌اند فعلی در پاسخ، پیام متنی می‌فرستد.
                if (typeof result !== "string" ||
                    !result.includes("با موفقیت ساخته شد")) {
                    message.textContent =
                        typeof result === "string"
                            ? result
                            : "ساخت حساب موفق نبود.";
                    return;
                }

                const account = {
                    name: name,
                    user_name: username
                };

                localStorage.setItem(
                    "myAccount",
                    JSON.stringify(account)
                );

                showProfile(account);

            } catch (error) {
                message.textContent =
                    "ارتباط با سرور برقرار نشد. دوباره تلاش کن.";
            } finally {
                submitBtn.disabled = false;
            }
        });

        document.getElementById("logoutBtn").addEventListener(
            "click",
            function() {
                localStorage.removeItem("myAccount");
                profile.hidden = true;
                signup.hidden = false;
                form.reset();
                message.textContent = "";
            }
        );
    </script>

</body>
</html>
