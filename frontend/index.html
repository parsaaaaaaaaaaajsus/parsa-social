<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signala | سیگنالا</title>

<style>
:root {
  --bg: #f4f5fb;
  --card: #fff;
  --text: #202238;
  --muted: #777d92;
  --primary: #6565e8;
  --soft: #eeeeff;
  --border: #e7e8f1;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
  line-height: 1.8;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #ffffffed;
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 850px;
  margin: auto;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand { font-size: 22px; font-weight: bold; color: var(--primary); }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: normal; }
.container { max-width: 700px; margin: 24px auto 100px; padding: 0 14px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 19px;
  margin-bottom: 15px;
  box-shadow: 0 5px 22px #20223808;
}
h1 { font-size: 23px; margin: 0 0 6px; }
h2 { font-size: 18px; margin: 0 0 12px; }
.muted { color: var(--muted); font-size: 13px; }
input, textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px;
  margin: 5px 0 12px;
  background: #fcfcff;
}
textarea { min-height: 100px; resize: vertical; }
button {
  border: 0;
  border-radius: 10px;
  padding: 9px 14px;
}
.primary { background: var(--primary); color: white; }
.secondary { background: #f0f1f8; color: var(--text); }
.tabs { display: flex; gap: 8px; margin: 18px 0; }
.tabs button { flex: 1; background: #f0f1f8; }
.tabs button.active { background: var(--soft); color: var(--primary); }
.hidden { display: none !important; }
.notice {
  display: none;
  padding: 10px 13px;
  border-radius: 10px;
  margin-bottom: 12px;
  font-size: 13px;
}
.notice.show { display: block; background: #e9f8ef; color: #18794e; }
.notice.error { background: #fff0f1; color: #b4233c; }
.post-head { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--primary); background: var(--soft); font-weight: bold;
}
.post-title { font-size: 18px; font-weight: bold; margin-top: 15px; }
.post-text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 7px 0 15px; }
.reaction-heading { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.reactions { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.reaction {
  background: #f7f8fc;
  border: 1px solid var(--border);
  padding: 5px 9px;
  min-width: 52px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
}
.reaction.selected { background: var(--soft); border-color: var(--primary); }
.count { font-size: 12px; color: var(--muted); }
.post-actions {
  display: flex; flex-wrap: wrap; gap: 8px;
  border-top: 1px solid var(--border); padding-top: 12px;
}
.comments { margin-top: 13px; border-top: 1px solid var(--border); padding-top: 12px; }
.comment { background: #f6f7fb; padding: 8px 10px; border-radius: 9px; margin-bottom: 7px; font-size: 13px; }
.comment strong { margin-left: 6px; }
.comment-form { display: flex; gap: 7px; margin-top: 10px; }
.comment-form input { margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 25px 10px; }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: center; gap: 10px;
  padding: 10px; background: #ffffffed;
  border-top: 1px solid var(--border);
}
.bottom-nav button { min-width: 135px; }
@media (max-width: 480px) {
  .card { padding: 14px; }
  .container { margin-top: 15px; }
}
</style>
</head>

<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      Signala
      <small>ایده‌ها، گفتگوها، آدم‌ها</small>
    </div>
    <button id="logoutButton" class="secondary hidden" onclick="logout()">خروج</button>
  </div>
</header>

<main class="container">
  <div id="notice" class="notice"></div>

  <section id="auth" class="card">
    <h1>به سیگنالا خوش اومدی</h1>
    <p class="muted">وارد حساب شو یا حساب جدید بساز.</p>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showAuth('login')">ورود</button>
      <button id="signupTab" onclick="showAuth('signup')">ثبت‌نام</button>
    </div>

    <form id="loginForm" onsubmit="login(event)">
      <input id="loginUsername" placeholder="نام کاربری" required autocomplete="username">
      <input id="loginPassword" type="password" placeholder="رمز عبور" required autocomplete="current-password">
      <button class="primary" style="width:100%">ورود به حساب</button>
    </form>

    <form id="signupForm" class="hidden" onsubmit="signup(event)">
      <input id="signupName" placeholder="نام نمایشی" required>
      <input id="signupUsername" placeholder="نام کاربری" required autocomplete="username">
      <input id="signupPassword" type="password" placeholder="رمز عبور" required autocomplete="new-password">
      <button class="primary" style="width:100%">ساخت حساب</button>
    </form>

    <p class="muted" style="text-align:center;margin:15px 0 0">
      ورود با گوگل در نسخهٔ آینده اضافه می‌شود.
    </p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="post-head">
        <div class="avatar">S</div>
        <div>
          <strong id="profileName">حساب کاربری</strong>
          <div id="profileUsername" class="muted"></div>
        </div>
      </div>
    </div>

    <div class="card" id="compose">
      <h2>چی تو ذهنته؟</h2>
      <form onsubmit="sharePost(event)">
        <input id="postTitle" placeholder="عنوان پست" required maxlength="120">
        <textarea id="postText" placeholder="متنت رو بنویس..." required></textarea>
        <button class="primary">انتشار پست</button>
      </form>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin:20px 4px 12px">
      <h2 id="feedTitle">پست‌های تازه</h2>
      <button class="secondary" onclick="refreshPosts()">به‌روزرسانی</button>
    </div>
    <div id="posts"></div>
  </section>
</main>

<nav id="bottomNav" class="bottom-nav hidden">
  <button id="feedButton" class="primary" onclick="loadPosts()">پست‌های عمومی</button>
  <button id="myPostsButton" class="secondary" onclick="loadMyPosts()">پست‌های من</button>
</nav>

<script>
const REACTIONS = ["😂", "👍", "😒", "😢", "🤩", "😐", "😭", "😡"];

let currentUser = null;
let currentView = "feed";
let postsCache = [];

function showNotice(message, error = false) {
  const box = document.getElementById("notice");
  box.textContent = message || "درخواست انجام شد.";
  box.className = "notice show" + (error ? " error" : "");
  clearTimeout(showNotice.timer);
  showNotice.timer = setTimeout(() => box.className = "notice", 3500);
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    credentials: "include",
    ...options
  });

  const type = response.headers.get("content-type") || "";
  const result = type.includes("application/json")
    ? await response.json()
    : await response.text();

  if (!response.ok) {
    throw new Error(typeof result === "string" ? result : "درخواست ناموفق بود.");
  }
  return result;
}

function showAuth(mode) {
  const loginMode = mode === "login";
  document.getElementById("loginForm").classList.toggle("hidden", !loginMode);
  document.getElementById("signupForm").classList.toggle("hidden", loginMode);
  document.getElementById("loginTab").classList.toggle("active", loginMode);
  document.getElementById("signupTab").classList.toggle("active", !loginMode);
}

async function login(event) {
  event.preventDefault();

  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;

  try {
    const result = await api(
      `/login?user_name=${encodeURIComponent(username)}&pass_word=${encodeURIComponent(password)}`,
      { method: "POST" }
    );

    showNotice(result);
    if (typeof result === "string" && result.includes("موفقیت")) {
      currentUser = { username, name: username };
      enterApp();
    }
  } catch (error) {
    showNotice(error.message, true);
  }
}

async function signup(event) {
  event.preventDefault();

  const name = document.getElementById("signupName").value.trim();
  const username = document.getElementById("signupUsername").value.trim();
  const password = document.getElementById("signupPassword").value;

  try {
    const result = await api("/logup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        Name: name,
        User_name: username,
        PassWord: password
      })
    });

    showNotice(result);

    if (typeof result === "string" && result.includes("موفقیت")) {
      currentUser = { username, name };
      enterApp();
    }
  } catch (error) {
    showNotice(error.message, true);
  }
}

function enterApp() {
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("bottomNav").classList.remove("hidden");
  document.getElementById("logoutButton").classList.remove("hidden");
  document.getElementById("profileName").textContent = currentUser.name;
  document.getElementById("profileUsername").textContent = "@" + currentUser.username;
  loadPosts();
}

async function logout() {
  try {
    const result = await api("/logout?all=false", { method: "DELETE" });
    showNotice(result || "از حساب خارج شدی.");
  } catch (error) {
    showNotice(error.message, true);
  }

  currentUser = null;
  document.getElementById("auth").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("bottomNav").classList.add("hidden");
  document.getElementById("logoutButton").classList.add("hidden");
}

async function sharePost(event) {
  event.preventDefault();

  const title = document.getElementById("postTitle").value.trim();
  const text = document.getElementById("postText").value.trim();

  try {
    const result = await api(
      `/share-post?user__name=${encodeURIComponent(currentUser.username)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ Title: title, Text: text, Like: 0 })
      }
    );

    showNotice(result);
    document.getElementById("postTitle").value = "";
    document.getElementById("postText").value = "";
    await refreshPosts();
  } catch (error) {
    showNotice(error.message, true);
  }
}

async function loadPosts() {
  currentView = "feed";
  document.getElementById("feedTitle").textContent = "پست‌های تازه";
  document.getElementById("feedButton").className = "primary";
  document.getElementById("myPostsButton").className = "secondary";

  try {
    const data = await api("/posts");
    postsCache = Array.isArray(data) ? data : [];
    renderPosts(postsCache);
  } catch (error) {
    showNotice(error.message, true);
  }
}

async function loadMyPosts() {
  currentView = "mine";
  document.getElementById("feedTitle").textContent = "پست‌های من";
  document.getElementById("feedButton").className = "secondary";
  document.getElementById("myPostsButton").className = "primary";

  try {
    const data = await api("/my-posts?user_name=" + encodeURIComponent(currentUser.username));
    if (!Array.isArray(data)) {
      showNotice(data, true);
      return;
    }
    postsCache = data;
    renderPosts(postsCache);
  } catch (error) {
    showNotice(error.message, true);
  }
}

async function refreshPosts() {
  if (currentView === "mine") await loadMyPosts();
  else await loadPosts();
}

function renderPosts(posts) {
  const container = document.getElementById("posts");
  container.replaceChildren();

  if (!posts.length) {
    const empty = document.createElement("div");
    empty.className = "card empty";
    empty.textContent = "هنوز پستی وجود نداره. اولین پست رو منتشر کن!";
    container.appendChild(empty);
    return;
  }

  [...posts].reverse().forEach(post => container.appendChild(createPost(post)));
}

function createPost(post) {
  const card = document.createElement("article");
  card.className = "card";

  const author = post.user_name || currentUser.username;
  const reactions = post.reactions && typeof post.reactions === "object"
    ? post.reactions : {};

  const head = document.createElement("div");
  head.className = "post-head";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = author.slice(0, 1).toUpperCase();

  const authorInfo = document.createElement("div");
  const authorName = document.createElement("strong");
  authorName.textContent = author;
  const label = document.createElement("div");
  label.className = "muted";
  label.textContent = "عضو سیگنالا";
  authorInfo.append(authorName, label);
  head.append(avatar, authorInfo);
  card.appendChild(head);

  if (post.title) {
    const title = document.createElement("div");
    title.className = "post-title";
    title.textContent = post.title;
    card.appendChild(title);
  }

  const body = document.createElement("div");
  body.className = "post-text";
  body.textContent = post.text || "";
  card.appendChild(body);

  const reactionHeading = document.createElement("div");
  reactionHeading.className = "reaction-heading";
  reactionHeading.textContent = "واکنش‌ها";
  card.appendChild(reactionHeading);

  const reactionContainer = document.createElement("div");
  reactionContainer.className = "reactions";

  const myReaction = reactions[currentUser.username];

  REACTIONS.forEach(emoji => {
    // شمارش تعداد کاربران دارای این ایموجی از دیکشنری بک‌اند
    const count = Object.values(reactions).filter(value => value === emoji).length;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "reaction" + (myReaction === emoji ? " selected" : "");
    button.title = "واکنش " + emoji;

    const emojiText = document.createElement("span");
    emojiText.textContent = emoji;

    const countText = document.createElement("span");
    countText.className = "count";
    countText.textContent = count;

    button.append(emojiText, countText);
    button.addEventListener("click", () => sendReaction(post["num-p"], emoji));
    reactionContainer.appendChild(button);
  });

  card.appendChild(reactionContainer);

  const actions = document.createElement("div");
  actions.className = "post-actions";

  const likesCount = Array.isArray(post.likes) ? (Number(post.likes[0]) || 0) : 0;
  const likeButton = document.createElement("button");
  likeButton.className = "secondary";
  likeButton.textContent = `👍 لایک (${likesCount})`;
  likeButton.addEventListener("click", () => sendLike(post["num-p"]));

  const comments = Array.isArray(post.comment) ? post.comment : [];
  const commentsButton = document.createElement("button");
  commentsButton.className = "secondary";
  commentsButton.textContent = `💬 کامنت (${comments.length})`;

  actions.append(likeButton, commentsButton);
  card.appendChild(actions);

  const commentSection = document.createElement("section");
  commentSection.className = "comments hidden";

  comments.forEach(comment => {
    const item = document.createElement("div");
    item.className = "comment";

    const name = document.createElement("strong");
    name.textContent = comment.user_name || "کاربر";

    const text = document.createElement("span");
    text.textContent = comment.text || "";

    item.append(name, text);
    commentSection.appendChild(item);
  });

  const form = document.createElement("form");
  form.className = "comment-form";

  const input = document.createElement("input");
  input.placeholder = "کامنت بنویس...";
  input.required = true;

  const sendButton = document.createElement("button");
  sendButton.className = "primary";
  sendButton.textContent = "ارسال";

  form.append(input, sendButton);
  form.addEventListener("submit", event => {
    event.preventDefault();
    sendComment(post["num-p"], input.value.trim());
  });

  commentSection.appendChild(form);
  commentsButton.addEventListener("click", () => commentSection.classList.toggle("hidden"));
  card.appendChild(commentSection);

  return card;
}

async function sendReaction(postId, emoji) {
  try {
    const result = await api(
      `/Reaction?len_post=${encodeURIComponent(postId)}&re_action=${encodeURIComponent(emoji)}`,
      { method: "POST" }
    );
    showNotice(result);
    await refreshPosts();
  } catch (error) {
    showNotice(error.message, true);
  }
}

async function sendLike(postId) {
  try {
    const result = await api(
      `/like-p?num_post=${encodeURIComponent(postId)}`,
      { method: "POST" }
    );
    showNotice(result);
    await refreshPosts();
  } catch (error) {
    showNotice(error.message, true);
  }
}

async function sendComment(postId, text) {
  if (!text) return;

  try {
    const result = await api(
      `/Comment?len_post=${encodeURIComponent(postId)}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ Text: text })
      }
    );
    showNotice(result);
    await refreshPosts();
  } catch (error) {
    showNotice(error.message, true);
  }
}
</script>
</body>
</html>
