```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شبکه اجتماعی</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f2f4f7;
    color: #20242b;
}

header {
    background: #202b3c;
    color: white;
    padding: 18px;
    text-align: center;
}

main {
    max-width: 650px;
    margin: 20px auto;
    padding: 12px;
}

.panel, .post {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px #0000000d;
}

input, textarea {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccd2da;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
}

textarea {
    resize: vertical;
    min-height: 90px;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: #2864dc;
    color: white;
    cursor: pointer;
    font-family: inherit;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.secondary {
    background: #e6eaf0;
    color: #20242b;
}

.like-btn {
    background: #f0f2f5;
    color: #303846;
    border: 1px solid #d9dee7;
}

.like-btn.liked {
    background: #ffe8ed;
    color: #d52249;
    border-color: #ffc6d2;
}

.post h3 {
    margin-top: 0;
    overflow-wrap: anywhere;
}

.post p {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.post-info {
    color: #747d8b;
    font-size: 13px;
    margin-bottom: 12px;
}

.post-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.notice {
    margin: 10px 0;
    font-size: 14px;
}

.hidden {
    display: none;
}

nav {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

nav button {
    flex: 1;
}

#status {
    white-space: pre-wrap;
}
</style>
</head>

<body>
<header>
    <h2>شبکه اجتماعی</h2>
</header>

<main>
    <section id="auth">
        <div class="panel">
            <h3>ساخت حساب</h3>
            <input id="reg-name" placeholder="نام">
            <input id="reg-user" placeholder="نام کاربری">
            <input id="reg-pass" type="password" placeholder="رمز عبور">
            <button onclick="register()">ثبت‌نام</button>
        </div>

        <div class="panel">
            <h3>ورود</h3>
            <input id="login-user" placeholder="نام کاربری">
            <input id="login-pass" type="password" placeholder="رمز عبور">
            <button onclick="login()">ورود به حساب</button>
        </div>
    </section>

    <section id="app" class="hidden">
        <div class="panel">
            <h3 id="welcome"></h3>
            <button class="secondary" onclick="logout()">خروج از حساب</button>
        </div>

        <nav>
            <button onclick="showPage('feed')">همه پست‌ها</button>
            <button onclick="showPage('profile')">پروفایل من</button>
        </nav>

        <section id="feed-page">
            <div class="panel">
                <h3>انتشار پست</h3>
                <input id="post-title" placeholder="عنوان پست">
                <textarea id="post-text" placeholder="چی می‌خوای به اشتراک بذاری؟"></textarea>
                <button onclick="sharePost()">انتشار</button>
            </div>

            <h3>پست‌های کاربران</h3>
            <div id="feed"></div>
        </section>

        <section id="profile-page" class="hidden">
            <h3>پست‌های من</h3>
            <div id="my-posts"></div>
        </section>
    </section>

    <p id="status" class="notice"></p>
</main>

<script>
const API = "";
let currentUser = "";
let currentName = "";

function message(text) {
    document.getElementById("status").textContent = text;
}

async function request(path, options = {}) {
    const response = await fetch(API + path, options);

    if (!response.ok) {
        throw new Error("خطا در ارتباط با سرور");
    }

    return response.json();
}

async function register() {
    const user = {
        Name: document.getElementById("reg-name").value.trim(),
        User_name: document.getElementById("reg-user").value.trim(),
        PassWord: document.getElementById("reg-pass").value
    };

    if (!user.Name || !user.User_name || !user.PassWord) {
        message("همه فیلدهای ثبت‌نام را پر کن.");
        return;
    }

    try {
        const result = await request("/logup", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(user)
        });

        message(result);
    } catch (error) {
        message(error.message);
    }
}

async function login() {
    const username = document.getElementById("login-user").value.trim();
    const password = document.getElementById("login-pass").value;

    if (!username || !password) {
        message("نام کاربری و رمز عبور را وارد کن.");
        return;
    }

    try {
        const result = await request(
            "/login?user_name=" + encodeURIComponent(username) +
            "&pass_word=" + encodeURIComponent(password),
            {method: "POST"}
        );

        if (typeof result !== "string" ||
            !result.includes("با موفقیت")) {
            message(result);
            return;
        }

        currentUser = username;
        currentName = username;

        document.getElementById("auth").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        document.getElementById("welcome").textContent =
            "خوش آمدی، " + currentName;

        message("");
        showPage("feed");
    } catch (error) {
        message(error.message);
    }
}

function logout() {
    currentUser = "";
    currentName = "";

    document.getElementById("app").classList.add("hidden");
    document.getElementById("auth").classList.remove("hidden");
    message("از حساب خارج شدی.");
}

function showPage(page) {
    const feedPage = document.getElementById("feed-page");
    const profilePage = document.getElementById("profile-page");

    feedPage.classList.toggle("hidden", page !== "feed");
    profilePage.classList.toggle("hidden", page !== "profile");

    if (page === "feed") loadPosts();
    if (page === "profile") loadMyPosts();
}

// برای هر کاربر، فهرست پست‌هایی که در این مرورگر لایک کرده
function likedKey() {
    return "liked-posts-" + currentUser;
}

function getLikedPosts() {
    try {
        return JSON.parse(localStorage.getItem(likedKey()) || "[]");
    } catch {
        return [];
    }
}

function markLiked(postId) {
    const liked = getLikedPosts();

    if (!liked.includes(postId)) {
        liked.push(postId);
        localStorage.setItem(likedKey(), JSON.stringify(liked));
    }
}

function createPostCard(post) {
    const card = document.createElement("article");
    card.className = "post";

    const title = document.createElement("h3");
    title.textContent = post.title;

    const info = document.createElement("div");
    info.className = "post-info";
    info.textContent = "نویسنده: " + post.user_name;

    const text = document.createElement("p");
    text.textContent = post.text;

    const actions = document.createElement("div");
    actions.className = "post-actions";

    const likeButton = document.createElement("button");
    likeButton.className = "like-btn";

    const count = document.createElement("span");
    count.textContent = "❤️ " + post.likes;

    const liked = getLikedPosts().includes(post["num-p"]);

    if (liked) {
        likeButton.textContent = "لایک شده";
        likeButton.classList.add("liked");
        likeButton.disabled = true;
    } else {
        likeButton.textContent = "لایک";
        likeButton.onclick = async () => {
            likeButton.disabled = true;

            try {
                const result = await request(
                    "/like-p?num_post=" + encodeURIComponent(post["num-p"]),
                    {method: "POST"}
                );

                // بک‌اند فعلی پس از لایک، مقدار null برمی‌گرداند.
                // اگر پاسخ خطا باشد، تعداد لایک را به‌روزرسانی نکن.
                if (typeof result === "string" &&
                    result.includes("پیدا نشد")) {
                    message(result);
                    likeButton.disabled = false;
                    return;
                }

                markLiked(post["num-p"]);
                likeButton.textContent = "لایک شده";
                likeButton.classList.add("liked");
                count.textContent = "❤️ " + (Number(post.likes) + 1);
                message("لایک ثبت شد.");
            } catch (error) {
                message(error.message);
                likeButton.disabled = false;
            }
        };
    }

    actions.append(likeButton, count);
    card.append(title, info, text, actions);

    return card;
}

async function loadPosts() {
    const container = document.getElementById("feed");
    container.replaceChildren();

    try {
        const posts = await request("/posts");

        if (!Array.isArray(posts) || posts.length === 0) {
            container.textContent = "هنوز پستی منتشر نشده.";
            return;
        }

        posts.slice().reverse().forEach(post => {
            container.appendChild(createPostCard(post));
        });
    } catch (error) {
        container.textContent = error.message;
    }
}

async function loadMyPosts() {
    const container = document.getElementById("my-posts");
    container.replaceChildren();

    try {
        const posts = await request(
            "/my-posts?user_name=" + encodeURIComponent(currentUser)
        );

        if (!Array.isArray(posts) || posts.length === 0) {
            container.textContent = "هنوز پستی منتشر نکردی.";
            return;
        }

        posts.slice().reverse().forEach(post => {
            container.appendChild(createPostCard({
                ...post,
                user_name: currentUser
            }));
        });
    } catch (error) {
        container.textContent = error.message;
    }
}

async function sharePost() {
    const title = document.getElementById("post-title").value.trim();
    const text = document.getElementById("post-text").value.trim();

    if (!title || !text) {
        message("عنوان و متن پست را وارد کن.");
        return;
    }

    try {
        const result = await request(
            "/share-post?user_name=" + encodeURIComponent(currentUser),
            {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    Title: title,
                    Text: text,
                    Like: 0
                })
            }
        );

        message(result);
        document.getElementById("post-title").value = "";
        document.getElementById("post-text").value = "";
        showPage("feed");
    } catch (error) {
        message(error.message);
    }
}
</script>
</body>
</html>
