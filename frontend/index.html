```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبکه اجتماعی</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f5f8;
            color: #202938;
            padding-bottom: 80px;
        }

        header {
            background: #ffffff;
            padding: 18px;
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            border-bottom: 1px solid #e5e7eb;
        }

        main {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 14px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 16px;
            border-radius: 15px;
            box-shadow: 0 3px 12px #00000008;
        }

        h2, h3 {
            margin-top: 0;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border: 1px solid #d7dce3;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
            width: 100%;
            margin-top: 8px;
        }

        .secondary {
            background: #e8efff;
            color: #2455bb;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tabs button {
            flex: 1;
            background: #e8ebf0;
        }

        .tabs button.active {
            background: #2563eb;
            color: white;
        }

        .post {
            background: white;
            border: 1px solid #e8ebf0;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            overflow-wrap: anywhere;
        }

        .post h3 {
            margin-bottom: 10px;
        }

        .post-author {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .muted {
            color: #64748b;
            font-size: 13px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            display: flex;
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 8px;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }

        .bottom-nav button {
            flex: 1;
            background: white;
            color: #64748b;
            padding: 12px 5px;
        }

        .bottom-nav button.active {
            color: #2563eb;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        #message {
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>شبکه اجتماعی</header>

<main>
    <p id="message"></p>

    <!-- ثبت نام و ورود -->
    <section id="authPage">
        <div class="tabs">
            <button id="signupTab" class="active"
                onclick="showAuth('signup')">ثبت‌نام</button>

            <button id="loginTab"
                onclick="showAuth('login')">ورود</button>
        </div>

        <div class="card" id="signupForm">
            <h2>ساخت حساب کاربری</h2>

            <input id="signupName" placeholder="اسم شما">
            <input id="signupUsername" placeholder="نام کاربری">
            <input id="signupPassword" type="password"
                placeholder="رمز عبور">

            <button class="primary" onclick="signup()">
                ثبت‌نام
            </button>
        </div>

        <div class="card hidden" id="loginForm">
            <h2>ورود به حساب</h2>

            <input id="loginUsername" placeholder="نام کاربری">
            <input id="loginPassword" type="password"
                placeholder="رمز عبور">

            <button class="primary" onclick="login()">
                ورود
            </button>
        </div>
    </section>

    <!-- صفحه حساب کاربری -->
    <section id="profilePage" class="hidden">
        <div class="card">
            <h2>حساب کاربری من</h2>
            <p>اسم: <strong id="profileName"></strong></p>
            <p>یوزرنیم: <strong id="profileUsername"></strong></p>

            <button class="secondary" onclick="showMyPosts()">
                دیدن پست‌های من
            </button>

            <button class="secondary" onclick="logout()">
                خروج از حساب
            </button>
        </div>

        <div id="myPostsSection" class="hidden">
            <div class="card">
                <h2>انتشار پست</h2>

                <input id="postTitle" placeholder="عنوان پست">
                <textarea id="postText"
                    placeholder="چی می‌خوای منتشر کنی؟"></textarea>

                <button class="primary" onclick="sharePost()">
                    انتشار
                </button>
            </div>

            <div class="card">
                <h2>پست‌های من</h2>
                <div id="myPosts"></div>
            </div>
        </div>
    </section>

    <!-- صفحه عمومی -->
    <section id="publicPage" class="hidden">
        <div class="card">
            <h2>صفحه عمومی</h2>
            <p class="muted">پست‌های منتشرشده توسط کاربران</p>
            <button class="secondary" onclick="loadPublicPosts()">
                تازه‌سازی پست‌ها
            </button>
        </div>

        <div id="publicPosts"></div>
    </section>
</main>

<!-- نوار پایین -->
<nav id="bottomNav" class="bottom-nav hidden">
    <button id="profileNav" class="active"
        onclick="showPage('profile')">حساب کاربری</button>

    <button id="publicNav"
        onclick="showPage('public')">صفحه عمومی</button>
</nav>

<script>
    const authPage = document.getElementById("authPage");
    const profilePage = document.getElementById("profilePage");
    const publicPage = document.getElementById("publicPage");
    const bottomNav = document.getElementById("bottomNav");
    const message = document.getElementById("message");

    let currentUser = null;
    let currentName = null;

    function showMessage(text) {
        message.textContent = text;
    }

    function showAuth(type) {
        document.getElementById("signupForm").classList.toggle(
            "hidden", type !== "signup"
        );

        document.getElementById("loginForm").classList.toggle(
            "hidden", type !== "login"
        );

        document.getElementById("signupTab").classList.toggle(
            "active", type === "signup"
        );

        document.getElementById("loginTab").classList.toggle(
            "active", type === "login"
        );

        showMessage("");
    }

    async function readResponse(response) {
        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                typeof data.detail === "string"
                    ? data.detail
                    : "درخواست ناموفق بود."
            );
        }

        return data;
    }

    async function signup() {
        const Name = document.getElementById("signupName").value.trim();
        const User_name = document.getElementById(
            "signupUsername"
        ).value.trim();
        const PassWord = document.getElementById(
            "signupPassword"
        ).value;

        if (!Name || !User_name || !PassWord) {
            showMessage("لطفاً همه قسمت‌ها را پر کن.");
            return;
        }

        try {
            const response = await fetch("/logup", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({Name, User_name, PassWord})
            });

            const result = await readResponse(response);

            if (typeof result === "string" &&
                result.includes("با موفقیت")) {
                openAccount(User_name, Name);
                showMessage(result);
            } else {
                showMessage(
                    typeof result === "string"
                        ? result
                        : "ثبت‌نام ناموفق بود."
                );
            }
        } catch (error) {
            showMessage("خطا در ثبت‌نام: " + error.message);
        }
    }

    async function login() {
        const user_name = document.getElementById(
            "loginUsername"
        ).value.trim();
        const pass_word = document.getElementById(
            "loginPassword"
        ).value;

        if (!user_name || !pass_word) {
            showMessage("نام کاربری و رمز عبور را وارد کن.");
            return;
        }

        try {
            const params = new URLSearchParams({
                user_name,
                pass_word
            });

            const response = await fetch("/login?" + params.toString(), {
                method: "POST"
            });

            const result = await readResponse(response);

            if (typeof result === "string" &&
                result.includes("با موفقیت")) {
                // بک‌اند فعلی نام واقعی کاربر را در پاسخ ورود نمی‌دهد.
                openAccount(user_name, user_name);
                showMessage(result);
            } else {
                showMessage(
                    typeof result === "string"
                        ? result
                        : "ورود ناموفق بود."
                );
            }
        } catch (error) {
            showMessage("خطا در ورود: " + error.message);
        }
    }

    function openAccount(username, name) {
        currentUser = username;
        currentName = name;

        document.getElementById("profileName").textContent = name;
        document.getElementById("profileUsername").textContent = username;

        authPage.classList.add("hidden");
        profilePage.classList.remove("hidden");
        publicPage.classList.add("hidden");
        bottomNav.classList.remove("hidden");

        showPage("profile");
        document.getElementById("myPostsSection").classList.add("hidden");
    }

    function showPage(page) {
        if (!currentUser) {
            showMessage("برای استفاده از سایت باید وارد حساب شوی.");
            return;
        }

        profilePage.classList.toggle("hidden", page !== "profile");
        publicPage.classList.toggle("hidden", page !== "public");

        document.getElementById("profileNav").classList.toggle(
            "active", page === "profile"
        );

        document.getElementById("publicNav").classList.toggle(
            "active", page === "public"
        );

        showMessage("");

        if (page === "public") {
            loadPublicPosts();
        }
    }

    async function showMyPosts() {
        document.getElementById("myPostsSection").classList.remove("hidden");
        await loadMyPosts();
    }

    async function loadMyPosts() {
        if (!currentUser) return;

        try {
            const params = new URLSearchParams({
                user_name: currentUser
            });

            const response = await fetch("/my-posts?" + params.toString());
            const posts = await readResponse(response);
            renderPosts(posts, "myPosts", false);
        } catch (error) {
            showMessage("خطا در دریافت پست‌های شما: " + error.message);
        }
    }

    async function loadPublicPosts() {
        try {
            const response = await fetch("/posts");
            const posts = await readResponse(response);
            renderPosts(posts, "publicPosts", true);
        } catch (error) {
            showMessage("خطا در دریافت پست‌های عمومی: " + error.message);
        }
    }

    function renderPosts(posts, containerId, showAuthor) {
        const container = document.getElementById(containerId);
        container.replaceChildren();

        if (!Array.isArray(posts) || posts.length === 0) {
            container.textContent = "هنوز پستی منتشر نشده.";
            return;
        }

        [...posts].reverse().forEach(post => {
            const article = document.createElement("article");
            article.className = "post";

            const title = document.createElement("h3");
            title.textContent = post.title || "بدون عنوان";

            const text = document.createElement("p");
            text.textContent = post.text || "";

            article.appendChild(title);

            if (showAuthor) {
                const author = document.createElement("div");
                author.className = "post-author";
                author.textContent = "نویسنده: " + (
                    post.user_name || "ناشناس"
                );
                article.appendChild(author);
            }

            article.appendChild(text);
            container.appendChild(article);
        });
    }

    async function sharePost() {
        if (!currentUser) {
            showMessage("برای انتشار پست ابتدا وارد حساب شو.");
            return;
        }

        const Title = document.getElementById("postTitle").value.trim();
        const Text = document.getElementById("postText").value.trim();

        if (!Title || !Text) {
            showMessage("عنوان و متن پست را وارد کن.");
            return;
        }

        try {
            const params = new URLSearchParams({
                user_name: currentUser
            });

            const response = await fetch("/share-post?" + params.toString(), {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    Title,
                    Text,
                    Like: 0
                })
            });

            const result = await readResponse(response);

            if (typeof result === "string" &&
                result.includes("با موفقیت")) {
                document.getElementById("postTitle").value = "";
                document.getElementById("postText").value = "";

                showMessage(result);
                await loadMyPosts();
            } else {
                showMessage(
                    typeof result === "string"
                        ? result
                        : "انتشار پست ناموفق بود."
                );
            }
        } catch (error) {
            showMessage("خطا در انتشار پست: " + error.message);
        }
    }

    function logout() {
        currentUser = null;
        currentName = null;

        profilePage.classList.add("hidden");
        publicPage.classList.add("hidden");
        bottomNav.classList.add("hidden");
        authPage.classList.remove("hidden");

        showMessage("از حساب خارج شدی.");
        showAuth("login");
    }
</script>

</body>
</html>
