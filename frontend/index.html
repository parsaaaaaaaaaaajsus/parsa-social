<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سیگنالا</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>سیگنالا</h1>
    <div id="user-box" class="user-box hidden">
      <span id="user-label"></span>
      <button id="logout-btn" class="btn small danger">خروج</button>
      <button id="logout-all-btn" class="btn small danger">خروج از همه</button>
    </div>
  </header>

  <!-- ===== Auth Screen ===== -->
  <section id="auth-screen" class="card">
    <h2>ورود به سیگنالا</h2>
    <p class="muted">برای ادامه وارد حساب کاربری‌ات شو.</p>

    <div class="tabs">
      <button class="tab active" data-tab="login">ورود</button>
      <button class="tab" data-tab="signup">ثبت‌نام</button>
    </div>

    <form id="login-form" class="form">
      <input type="text" id="login-username" placeholder="نام کاربری" required />
      <input type="password" id="login-password" placeholder="رمز عبور" required />
      <button type="submit" class="btn">ورود</button>
    </form>

    <form id="signup-form" class="form hidden">
      <input type="text" id="signup-name" placeholder="نام نمایشی" required />
      <input type="text" id="signup-username" placeholder="نام کاربری" required />
      <input type="password" id="signup-password" placeholder="رمز عبور" required />
      <button type="submit" class="btn">ساخت حساب</button>
    </form>

    <p id="auth-msg" class="msg"></p>
  </section>

  <!-- ===== Main App ===== -->
  <main id="app-screen" class="hidden">
    <!-- New post -->
    <section class="card">
      <h2>چه چیزی در ذهنته؟</h2>
      <form id="post-form" class="form">
        <input type="text" id="post-title" placeholder="عنوان" required maxlength="100" />
        <textarea id="post-text" placeholder="متن پست..." required maxlength="2000"></textarea>
        <button type="submit" class="btn">انتشار پست</button>
      </form>
      <p id="post-msg" class="msg"></p>
    </section>

    <!-- My posts -->
    <section class="card">
      <h2>پست‌های من</h2>
      <div id="my-posts" class="posts"></div>
    </section>

    <!-- All posts -->
    <section class="card">
      <h2>آخرین پست‌ها</h2>
      <div id="all-posts" class="posts"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
