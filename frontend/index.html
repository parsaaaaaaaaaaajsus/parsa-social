<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیگنالا | شبکه اجتماعی</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #172033;
            --muted: #778198;
            --primary: #635bdb;
            --border: #e7eaf2;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        button, input, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
            border: none;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .header button, .primary {
            background: var(--primary);
            color: white;
            border-radius: 10px;
            padding: 10px 15px;
        }

        .layout {
            max-width: 1050px;
            margin: 25px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 230px minmax(0, 1fr);
            gap: 22px;
        }

        .sidebar, .composer, .post, .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .sidebar {
            padding: 18px;
            height: fit-content;
            position: sticky;
            top: 85px;
        }

        .nav-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 7px;
            text-align: right;
            border-radius: 9px;
            background: transparent;
            color: var(--text);
        }

        .nav-button:hover, .nav-button.active {
            background: #efedff;
            color: var(--primary);
        }

        .main {
            min-width: 0;
        }

        .composer {
            padding: 20px;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            outline: none;
            background: #fff;
            color: var(--text);
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 95px;
        }

        .composer input {
            margin-bottom: 10px;
        }

        .composer textarea {
            margin-bottom: 12px;
        }

        .composer-actions {
            display: flex;
            justify-content: flex-end;
        }

        .post {
            padding: 20px;
            margin-bottom: 16px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #eeecff;
            color: var(--primary);
            font-weight: bold;
        }

        .username {
            font-weight: bold;
        }

        .muted {
            color: var(--muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .post-title {
            margin: 0 0 10px;
            font-size: 19px;
            overflow-wrap: anywhere;
        }

        .post-text, .comment-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.9;
        }

        .post-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            margin-top: 16px;
        }

        .action {
            background: #f4f5fa;
            padding: 9px 12px;
            border-radius: 9px;
            color: #444e65;
        }

        .action:hover {
            background: #eae8ff;
            color: var(--primary);
        }

        .comments {
            margin-top: 17px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .comment {
            background: #f7f8fc;
            border-radius: 12px;
            padding: 13px;
            margin-top: 10px;
        }

        .comment-meta {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .comment-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 8px;
        }

        .comment-actions button {
            background: transparent;
            color: var(--primary);
            padding: 5px;
            font-size: 12px;
        }

        .replies {
            margin: 12px 0 0 0;
            padding-right: 12px;
            border-right: 2px solid #d9d5ff;
        }

        .reply {
            padding: 9px;
            margin-top: 7px;
            background: white;
            border-radius: 8px;
            font-size: 13px;
        }

        .comment-form, .reply-form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .comment-form input, .reply-form input {
            min-width: 0;
        }

        .comment-form button, .reply-form button {
            background: var(--primary);
            color: white;
            border-radius: 9px;
            padding: 0 13px;
        }

        .reaction-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .reaction-list button {
            background: white;
            border: 1px solid var(--border);
            padding: 6px 8px;
            border-radius: 8px;
        }

        .reaction-list button.selected {
            border-color: var(--primary);
            background: #eeecff;
        }

        .empty {
            text-align: center;
            padding: 45px 15px;
            color: var(--muted);
            background: white;
            border-radius: 15px;
        }

        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            display: grid;
            place-items: center;
            padding: 20px;
            z-index: 20;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 25px;
        }

        .auth-card h2 {
            margin-top: 0;
        }

        .auth-card input {
            margin: 7px 0;
        }

        .auth-card .primary {
            width: 100%;
            margin-top: 12px;
        }

        .auth-switch {
            background: none;
            color: var(--primary);
            margin-top: 15px;
            padding: 5px 0;
        }

        .notice {
            margin: 10px 0;
            font-size: 13px;
            line-height: 1.8;
            color: var(--muted);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            .layout {
                grid-template-columns: 1fr;
                margin-top: 15px;
            }

            .sidebar {
                position: static;
                display: flex;
                gap: 6px;
                padding: 8px;
                overflow-x: auto;
            }

            .nav-button {
                width: auto;
                white-space: nowrap;
                margin: 0;
            }

            .header {
                padding: 12px 15px;
            }

            .logo {
                font-size: 20px;
            }

            .post, .composer {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">سیگنالا</div>
    <div>
        <span id="currentUser" class="muted"></span>
        <button id="authButton" onclick="showAuth()">ورود / ثبت‌نام</button>
    </div>
</header>

<div class="layout">

    <aside class="sidebar">
        <button class="nav-button active" onclick="showFeed()">🏠 صفحه اصلی</button>
        <button class="nav-button" onclick="showMyPosts()">📝 پست‌های من</button>
        <button class="nav-button" onclick="refreshPosts()">🔄 بروزرسانی</button>
        <button class="nav-button" onclick="logout()">🚪 خروج</button>
    </aside>

    <main class="main">

        <section class="composer" id="composer">
            <h3>چه چیزی در ذهنته؟</h3>
            <input id="postTitle" placeholder="عنوان پست">
            <textarea id="postText" placeholder="متن پستت رو بنویس..."></textarea>
            <div class="composer-actions">
                <button class="primary" onclick="createPost()">انتشار پست</button>
            </div>
        </section>

        <div id="feed">
            <div class="empty">در حال دریافت پست‌ها...</div>
        </div>

    </main>
</div>

<div id="authOverlay" class="auth-overlay hidden">
    <section class="auth-card">
        <h2 id="authTitle">ورود به سیگنالا</h2>

        <div id="signupFields" class="hidden">
            <input id="signupName" placeholder="نام نمایشی">
        </div>

        <input id="authUsername" placeholder="نام کاربری">
        <input id="authPassword" type="password" placeholder="رمز عبور">

        <button class="primary" onclick="submitAuth()" id="authSubmit">
            ورود
        </button>

        <button class="auth-switch" onclick="toggleAuthMode()" id="authSwitch">
            حساب نداری؟ ثبت‌نام کن
        </button>

        <button class="auth-switch" onclick="hideAuth()">بستن</button>
        <div class="notice" id="authNotice"></div>
    </section>
</div>

<script>
    // اگر فرانت‌اند و بک‌اند روی یک دامنه‌اند، همین مقدار مناسب است.
    const API = window.location.origin;

    const EMOJIS = ["😂", "👍", "😒", "😢", "🤩", "😐", "😭", "😡"];

    let authMode = "login";
    let currentView = "feed";
    let currentUsername = null;
    let cachedPosts = [];

    async function request(path, options = {}) {
        const response = await fetch(API + path, {
            credentials: "include",
            ...options,
            headers: {
                ...(options.headers || {})
            }
        });

        const data = await response.json().catch(() => null);

        if (!response.ok) {
            throw new Error(
                typeof data === "string" ? data : "درخواست ناموفق بود."
            );
        }

        return data;
    }

    function query(params) {
        return new URLSearchParams(params).toString();
    }

    function showAuth() {
        document.getElementById("authOverlay").classList.remove("hidden");
    }

    function hideAuth() {
        document.getElementById("authOverlay").classList.add("hidden");
    }

    function toggleAuthMode() {
        authMode = authMode === "login" ? "signup" : "login";

        document.getElementById("authTitle").textContent =
            authMode === "login" ? "ورود به سیگنالا" : "ساخت حساب کاربری";

        document.getElementById("authSubmit").textContent =
            authMode === "login" ? "ورود" : "ثبت‌نام";

        document.getElementById("authSwitch").textContent =
            authMode === "login"
                ? "حساب نداری؟ ثبت‌نام کن"
                : "حساب داری؟ وارد شو";

        document.getElementById("signupFields")
            .classList.toggle("hidden", authMode !== "signup");

        document.getElementById("authNotice").textContent = "";
    }

    async function submitAuth() {
        const username = document.getElementById("authUsername").value.trim();
        const password = document.getElementById("authPassword").value;
        const name = document.getElementById("signupName").value.trim();

        if (!username || !password) {
            alert("نام کاربری و رمز عبور رو وارد کن.");
            return;
        }

        try {
            let result;

            if (authMode === "signup") {
                if (!name) {
                    alert("نام نمایشی رو وارد کن.");
                    return;
                }

                result = await request("/logup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        Name: name,
                        User_name: username,
                        PassWord: password
                    })
                });
            } else {
                result = await request(
                    "/login?" + query({
                        user_name: username,
                        pass_word: password
                    }),
                    { method: "POST" }
                );
            }

            document.getElementById("authNotice").textContent =
                typeof result === "string" ? result : "درخواست انجام شد.";

            if (typeof result === "string" &&
                (result.includes("موفقیت") || result.includes("ساخته شد"))) {
                currentUsername = username;
                updateUserDisplay();
                hideAuth();
                await refreshPosts();
            }
        } catch (error) {
            alert("خطا در ارتباط با سرور: " + error.message);
        }
    }

    function updateUserDisplay() {
        document.getElementById("currentUser").textContent =
            currentUsername ? "@" + currentUsername : "";

        document.getElementById("authButton").textContent =
            currentUsername ? "حساب من" : "ورود / ثبت‌نام";
    }

    async function logout() {
        try {
            const result = await request("/logout?all=false", {
                method: "DELETE"
            });

            alert(result);
            currentUsername = null;
            updateUserDisplay();
            await refreshPosts();
        } catch (error) {
            alert("برای خروج باید وارد حساب شده باشی.");
        }
    }

    async function createPost() {
        const title = document.getElementById("postTitle").value.trim();
        const text = document.getElementById("postText").value.trim();

        if (!title || !text) {
            alert("عنوان و متن پست رو وارد کن.");
            return;
        }

        try {
            const result = await request("/share-post", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    Title: title,
                    Text: text,
                    Like: 0
                })
            });

            alert(result);
            document.getElementById("postTitle").value = "";
            document.getElementById("postText").value = "";
            await refreshPosts();
        } catch (error) {
            alert("برای انتشار پست وارد حساب شو.");
        }
    }

    async function refreshPosts() {
        try {
            cachedPosts = await request("/posts");
            renderPosts(
                currentView === "mine"
                    ? cachedPosts.filter(p => p.user_name === currentUsername)
                    : cachedPosts
            );
        } catch (error) {
            document.getElementById("feed").innerHTML =
                '<div class="empty">دریافت پست‌ها ناموفق بود. اتصال سرور رو بررسی کن.</div>';
        }
    }

    function showFeed() {
        currentView = "feed";
        renderPosts(cachedPosts);
    }

    function showMyPosts() {
        currentView = "mine";

        if (!currentUsername) {
            alert("ابتدا وارد حساب خودت شو.");
            showAuth();
            return;
        }

        renderPosts(
            cachedPosts.filter(p => p.user_name === currentUsername)
        );
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    function renderPosts(posts) {
        const feed = document.getElementById("feed");

        if (!posts || posts.length === 0) {
            feed.innerHTML = '<div class="empty">هنوز پستی وجود نداره.</div>';
            return;
        }

        feed.innerHTML = [...posts].reverse().map(post => {
            const author = escapeHTML(post.user_name);
            const reactions = post.reactions || {};
            const comments = post.comment || [];
            const likes = post.likes || [0];

            const reactionCounts = {};
            Object.values(reactions).forEach(reaction => {
                reactionCounts[reaction] = (reactionCounts[reaction] || 0) + 1;
            });

            const reactionButtons = EMOJIS.map(emoji => `
                <button class="${reactions[currentUsername] === emoji ? "selected" : ""}"
                    onclick="reactToPost(${post["num-p"]}, '${emoji}')">
                    ${emoji} ${reactionCounts[emoji] || ""}
                </button>
            `).join("");

            return `
                <article class="post">
                    <div class="post-header">
                        <div class="avatar">${author.charAt(0).toUpperCase()}</div>
                        <div>
                            <div class="username">${author}</div>
                            <div class="muted">پست شماره ${post["num-p"]}</div>
                        </div>
                    </div>

                    <h2 class="post-title">${escapeHTML(post.title)}</h2>
                    <div class="post-text">${escapeHTML(post.text)}</div>

                    <div class="post-actions">
                        <button class="action"
                            onclick="likePost(${post["num-p"]})">
                            👍 لایک (${likes[0] || 0})
                        </button>

                        <button class="action"
                            onclick="toggleComments(${post["num-p"]})">
                            💬 کامنت (${comments.length})
                        </button>

                        ${currentUsername === author || currentUsername === "Admin"
                            ? `<button class="action" onclick="deletePost(${post["num-p"]})">🗑 حذف پست</button>`
                            : ""}
                    </div>

                    <div class="reaction-list">${reactionButtons}</div>

                    <section class="comments" id="comments-${post["num-p"]}">
                        <form class="comment-form"
                            onsubmit="addComment(event, ${post["num-p"]})">
                            <input name="text" placeholder="نظرت رو بنویس..." required>
                            <button type="submit">ارسال</button>
                        </form>

                        ${comments.map(comment => renderComment(post, comment)).join("")}
                    </section>
                </article>
            `;
        }).join("");
    }

    function renderComment(post, comment) {
        const author = escapeHTML(comment.user_name);
        const reactions = comment.reactions || {};
        const likes = comment.likes || [0];
        const replies = comment.reply || [];

        const reactionCounts = {};
        Object.values(reactions).forEach(emoji => {
            reactionCounts[emoji] = (reactionCounts[emoji] || 0) + 1;
        });

        return `
            <div class="comment">
                <div class="comment-meta">${author}</div>
                <div class="comment-text">${escapeHTML(comment.text)}</div>

                <div class="comment-actions">
                    <button onclick="likeComment(${post["num-p"]}, ${comment["num-c"]})">
                        👍 لایک (${likes[0] || 0})
                    </button>
                </div>

                <div class="reaction-list">
                    ${EMOJIS.map(emoji => `
                        <button
                            class="${reactions[currentUsername] === emoji ? "selected" : ""}"
                            onclick="reactToComment(${post["num-p"]}, ${comment["num-c"]}, '${emoji}')">
                            ${emoji} ${reactionCounts[emoji] || ""}
                        </button>
                    `).join("")}
                </div>

                <div class="replies">
                    ${replies.map(reply => `
                        <div class="reply">
                            <strong>${escapeHTML(reply.user_name)}</strong>
                            <div class="comment-text">${escapeHTML(reply.text)}</div>
                        </div>
                    `).join("")}
                </div>

                <form class="reply-form"
                    onsubmit="replyToComment(event, ${post["num-p"]}, ${comment["num-c"]})">
                    <input name="text" placeholder="پاسخ به این کامنت..." required>
                    <button type="submit">پاسخ</button>
                </form>
            </div>
        `;
    }

    function toggleComments(postId) {
        const section = document.getElementById("comments-" + postId);
        section.classList.toggle("hidden");
    }

    async function likePost(postId) {
        await performAction(
            "/like-p?" + query({ num_post: postId }),
            "POST"
        );
    }

    async function likeComment(postId, commentId) {
        await performAction(
            "/like-c?" + query({
                num_post: postId,
                len_c: commentId
            }),
            "POST"
        );
    }

    async function reactToPost(postId, emoji) {
        await performAction(
            "/Reaction?" + query({
                len_post: postId,
                re_action: emoji
            }),
            "POST"
        );
    }

    async function reactToComment(postId, commentId, emoji) {
        await performAction(
            "/Reaction-comment?" + query({
                len_post: postId,
                len_comment: commentId,
                re_action: emoji
            }),
            "POST"
        );
    }

    async function addComment(event, postId) {
        event.preventDefault();

        const form = event.currentTarget;
        const text = new FormData(form).get("text");

        try {
            const result = await request(
                "/Comment?" + query({ len_post: postId }),
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ Text: text })
                }
            );

            alert(result);
            await refreshPosts();
        } catch (error) {
            alert("برای کامنت گذاشتن وارد حساب شو.");
        }
    }

    async function replyToComment(event, postId, commentId) {
        event.preventDefault();

        const form = event.currentTarget;
        const text = new FormData(form).get("text");

        try {
            const result = await request(
                "/reply-to-comment?" + query({
                    len_post: postId,
                    len_comment: commentId,
                    text: text
                }),
                { method: "POST" }
            );

            alert(result);
            await refreshPosts();
        } catch (error) {
            alert("ارسال پاسخ ناموفق بود.");
        }
    }

    async function deletePost(postId) {
        if (!confirm("از حذف این پست مطمئنی؟")) return;

        try {
            const result = await request(
                "/delet-post?" + query({ len_post: postId }),
                { method: "DELETE" }
            );

            alert(result);
            await refreshPosts();
        } catch (error) {
            alert("حذف پست ناموفق بود.");
        }
    }

    async function performAction(path, method) {
        try {
            const result = await request(path, { method });
            if (typeof result === "string" &&
                result.includes("مشکلی")) {
                alert(result);
            }
            await refreshPosts();
        } catch (error) {
            alert("این عملیات انجام نشد. وارد حساب شو و دوباره امتحان کن.");
        }
    }

    refreshPosts();
</script>

</body>
</html>
