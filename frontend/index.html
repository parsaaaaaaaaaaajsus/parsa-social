```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شبکه اجتماعی</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #10131c;
    color: white;
    font-family: Tahoma, sans-serif;
}

.container {
    width: 90%;
    max-width: 390px;
    padding: 28px;
    background: #1b2030;
    border: 1px solid #30384d;
    border-radius: 18px;
}

h2 { text-align: center; }

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    cursor: pointer;
    font-family: inherit;
    border: 0;
    border-radius: 8px;
    padding: 12px;
}

.tabs button {
    flex: 1;
    background: #30384d;
    color: white;
}

.tabs .active, .submit {
    background: #5865f2;
    color: white;
}

input {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: 1px solid #39435b;
    border-radius: 8px;
    background: #111622;
    color: white;
}

.submit {
    width: 100%;
    margin-top: 8px;
}

.hidden { display: none; }

#message {
    text-align: center;
    margin-top: 16px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

#profile { text-align: center; }
</style>
</head>
<body>

<div class="container">
    <div id="auth">
        <h2 id="title">ساخت حساب کاربری</h2>

        <div class="tabs">
            <button id="signupTab" class="active" type="button">ثبت‌نام</button>
            <button id="loginTab" type="button">ورود</button>
        </div>

        <form id="signupForm">
            <input id="name" placeholder="نام شما" required>
            <input id="signupUsername" placeholder="نام کاربری" required>
            <input id="signupPassword" type="password"
                   placeholder="رمز عبور" required>
            <input id="confirmPassword" type="password"
                   placeholder="تکرار رمز عبور" required>
            <button class="submit" type="submit">ساخت حساب</button>
        </form>

        <form id="loginForm" class="hidden">
            <input id="loginUsername" placeholder="نام کاربری" required>
            <input id="loginPassword" type="password"
                   placeholder="رمز عبور" required>
            <button class="submit" type="submit">ورود به حساب</button>
        </form>

        <div id="message" role="status"></div>
    </div>

    <div id="profile" class="hidden">
        <h2>حساب کاربری شما</h2>
        <p id="profileName"></p>
        <p id="profileUsername"></p>
        <button id="logout" class="submit" type="button">خروج از حساب</button>
    </div>
</div>

<script>
const auth = document.getElementById("auth");
const profile = document.getElementById("profile");
const signupForm = document.getElementById("signupForm");
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

function showSignup() {
    signupForm.classList.remove("hidden");
    loginForm.classList.add("hidden");
    document.getElementById("signupTab").classList.add("active");
    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("title").textContent = "ساخت حساب کاربری";
    message.textContent = "";
}

function showLogin() {
    loginForm.classList.remove("hidden");
    signupForm.classList.add("hidden");
    document.getElementById("loginTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");
    document.getElementById("title").textContent = "ورود به حساب";
    message.textContent = "";
}

function enterAccount(name, username) {
    auth.classList.add("hidden");
    profile.classList.remove("hidden");
    document.getElementById("profileName").textContent = "نام: " + name;
    document.getElementById("profileUsername").textContent =
        "نام کاربری: " + username;
}

document.getElementById("signupTab").onclick = showSignup;
document.getElementById("loginTab").onclick = showLogin;

signupForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const username = document.getElementById("signupUsername").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (password !== confirm) {
        message.textContent = "رمزهای عبور یکسان نیستند.";
        return;
    }

    try {
        const response = await fetch("/logup", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                Name: name,
                User_name: username,
                PassWord: password
            })
        });

        const result = await response.json();

        if (typeof result !== "string" ||
            !result.includes("با موفقیت ساخته شد")) {
            message.textContent = typeof result === "string"
                ? result : "ثبت‌نام انجام نشد.";
            return;
        }

        signupForm.reset();
        enterAccount(name, username);

    } catch {
        message.textContent = "ارتباط با سرور برقرار نشد.";
    }
});

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
        const params = new URLSearchParams({
            user_name: username,
            pass_word: password
        });

        const response = await fetch("/login?" + params.toString(), {
            method: "POST"
        });

        const result = await response.json();

        if (typeof result === "string" &&
            result.includes("با موفقیت به حساب خود وارد شدید")) {
            loginForm.reset();
            enterAccount(username, username);
        } else {
            message.textContent = typeof result === "string"
                ? result : "ورود انجام نشد.";
        }

    } catch {
        message.textContent = "ارتباط با سرور برقرار نشد.";
    }
});

document.getElementById("logout").onclick = function() {
    profile.classList.add("hidden");
    auth.classList.remove("hidden");
    showLogin();
};
</script>
</body>
</html>
