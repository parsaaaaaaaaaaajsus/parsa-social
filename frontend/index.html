```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود و ثبت‌نام</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #10131c;
    color: white;
    font-family: Tahoma, sans-serif;
}

.container {
    width: 90%;
    max-width: 390px;
    padding: 28px;
    background: #1b2030;
    border: 1px solid #30384d;
    border-radius: 18px;
}

h2 {
    text-align: center;
    margin-top: 0;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
}

button {
    cursor: pointer;
    font-family: inherit;
}

.tabs button {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #30384d;
    color: white;
}

.tabs button.active {
    background: #5865f2;
}

input {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 12px 0;
    border: 1px solid #39435b;
    border-radius: 8px;
    background: #111622;
    color: white;
    outline: none;
}

input:focus {
    border-color: #7884ff;
}

.submit {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: #5865f2;
    color: white;
    font-size: 15px;
}

#message {
    margin-top: 16px;
    text-align: center;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.hidden {
    display: none;
}
</style>
</head>

<body>
<div class="container">
    <h2 id="title">ساخت حساب کاربری</h2>

    <div class="tabs">
        <button id="signupTab" class="active" type="button">
            ثبت‌نام
        </button>
        <button id="loginTab" type="button">
            ورود
        </button>
    </div>

    <form id="signupForm">
        <input id="name" placeholder="نام شما" required>
        <input id="signupUsername" placeholder="نام کاربری" required>
        <input id="signupPassword" type="password"
               placeholder="رمز عبور" required minlength="8">
        <input id="confirmPassword" type="password"
               placeholder="تکرار رمز عبور" required minlength="8">
        <button class="submit" type="submit">ساخت حساب</button>
    </form>

    <form id="loginForm" class="hidden">
        <input id="loginUsername" placeholder="نام کاربری" required>
        <input id="loginPassword" type="password"
               placeholder="رمز عبور" required>
        <button class="submit" type="submit">ورود به حساب</button>
    </form>

    <div id="message" role="status"></div>
</div>

<script>
const signupForm = document.getElementById("signupForm");
const loginForm = document.getElementById("loginForm");
const signupTab = document.getElementById("signupTab");
const loginTab = document.getElementById("loginTab");
const title = document.getElementById("title");
const message = document.getElementById("message");

function showSignup() {
    signupForm.classList.remove("hidden");
    loginForm.classList.add("hidden");
    signupTab.classList.add("active");
    loginTab.classList.remove("active");
    title.textContent = "ساخت حساب کاربری";
    message.textContent = "";
}

function showLogin() {
    loginForm.classList.remove("hidden");
    signupForm.classList.add("hidden");
    loginTab.classList.add("active");
    signupTab.classList.remove("active");
    title.textContent = "ورود به حساب";
    message.textContent = "";
}

signupTab.addEventListener("click", showSignup);
loginTab.addEventListener("click", showLogin);

signupForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const username = document.getElementById("signupUsername").value.trim();
    const password = document.getElementById("signupPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent = "رمزهای عبور یکسان نیستند.";
        return;
    }

    try {
        const response = await fetch("/logup", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                Name: name,
                User_name: username,
                PassWord: password
            })
        });

        const result = await response.json().catch(() => null);
        const text = typeof result === "string"
            ? result
            : JSON.stringify(result);

        message.textContent = text || "پاسخ نامعتبر از سرور دریافت شد.";

        if (text && text.includes("با موفقیت ساخته شد")) {
            signupForm.reset();
            showLogin();
            message.textContent = "حساب ساخته شد؛ حالا وارد شو.";
            document.getElementById("loginUsername").value = username;
        }
    } catch {
        message.textContent = "ارتباط با سرور برقرار نشد.";
    }
});

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
        const response = await fetch(
            "/login?user_name=" + encodeURIComponent(username) +
            "&pass_word=" + encodeURIComponent(password),
            {method: "GET"}
        );

        const result = await response.json().catch(() => null);
        const text = typeof result === "string"
            ? result
            : JSON.stringify(result);

        message.textContent = text || "پاسخ نامعتبر از سرور دریافت شد.";
    } catch {
        message.textContent = "ارتباط با سرور برقرار نشد.";
    }
});
</script>
</body>
</html>
